# This file was configured for Flutter and Firebase Hosting

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Instala o Flutter no servidor do GitHub
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 2. Baixa dependências, gera traduções e compila para Web
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build web --release

      # 3. Cria uma prévia do site temporária para o PR
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPERWEBER_9A398 }}
          projectId: superweber-9a398