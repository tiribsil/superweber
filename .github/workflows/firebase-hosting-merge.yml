# This file was configured for Flutter and Firebase Hosting

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Instala o Flutter no servidor do GitHub
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 2. Baixa dependências, gera traduções e compila para Web
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build web --release

      # 3. Publica oficialmente no ar (Canal Live)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPERWEBER_9A398 }}
          channelId: live
          projectId: superweber-9a398